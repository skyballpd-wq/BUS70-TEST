plugins { id "com.android.application" }

android {
    namespace "kr.bus70.driver"
    compileSdk 35

    defaultConfig {
        applicationId "kr.bus70.driver"
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 76
        versionName "0.76-mascot"
    }

    sourceSets { test.resources.srcDir "../../tests" }

    signingConfigs {
        release {
            def keystorePath = System.getenv("BUS70_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("BUS70_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BUS70_KEY_ALIAS")
                keyPassword System.getenv("BUS70_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
