name: Android mascot widget
on:
  push:
    paths:
      - "android/app/src/**/Mascot*.java"
      - "android/app/src/main/res/**"
      - "android/app/src/**/AndroidManifest.xml"
      - "android/app/build.gradle"
      - ".github/workflows/mascot-widget.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          script: gradle -p android --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mascot-widget-test-report
          path: android/app/build/reports/androidTests/connected/debug
          if-no-files-found: ignore
