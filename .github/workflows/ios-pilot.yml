name: iOS native pilot
on:
  pull_request:
    paths: ['ios/**', 'tests/ios-*.test.js', 'driver-automation.js', 'driver-outbox.js', '.github/workflows/ios-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared GPS safeguards and native engine
        run: |
          node tests/ios-native-engine.test.js
          node tests/ios-arrival-policy.test.js
          node tests/departure-evidence.test.js
          node tests/gbis-outage-recovery.test.js
      - name: Generate unsigned Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Compile and test on iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for key,group in d["devices"].items() if "iOS" in key for x in group if "iPhone" in x["name"]))')
          xcodebuild test -project ios/SoshinDriver.xcodeproj -scheme SoshinDriver -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/ios-build" -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Compile unsigned iOS device target
        run: xcodebuild build -project ios/SoshinDriver.xcodeproj -scheme SoshinDriver -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-test-results-not-installable
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
