name: Driver mobile layout

on:
  pull_request:
    paths:
      - "index.html"
      - "accident-report.js"
      - "mobile-compat.js"
      - "tests/mobile-compat*"
      - "apps-script/AccidentReport.gs"
      - "apps-script/ManagerDispatch.gs"
      - "tests/accident-report*"
      - "accident-report.css"
      - "driver-recording.js"
      - "tests/realtime-health.test.js"
      - "tests/realtime-health.browser.cjs"
      - "tests/contact-layout.browser.cjs"
      - "tests/schedule-controls.browser.cjs"
      - "tests/driver-leave.test.js"
      - "tests/driver-leave.browser.cjs"
      - "apps-script/AuthStep9.gs"
      - "tests/current-date-schedule.test.js"
      - "tests/schedule-session-recovery.test.js"
      - ".github/workflows/contact-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Korean font for visual evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/contact-layout" --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Check five viewport sizes with synthetic contacts
        env:
          CONTACT_LAYOUT_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          CONTACT_LAYOUT_OUTPUT: ${{ runner.temp }}/contact-layout-output
        run: |
          export NODE_PATH="$RUNNER_TEMP/contact-layout/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          test -n "$CHROME_BIN"
          node tests/contact-layout.browser.cjs --before
          node tests/contact-layout.browser.cjs
          node tests/emergency-contacts.test.js
          node tests/schedule-controls.browser.cjs
          node tests/mobile-compat.test.js
          node tests/mobile-compat.browser.cjs
          node tests/realtime-health.test.js
          node tests/realtime-health.browser.cjs
          node tests/departure-evidence.test.js
          node tests/departure-onset.test.js
          node tests/observed-headway.test.js
          node tests/field-cockpit.browser.cjs
          node tests/gbis-outage-recovery.test.js
          node tests/driver-leave.test.js
          node tests/driver-leave.browser.cjs
          node tests/startup-performance.test.js
          node tests/private-route-store.test.js
          node tests/fleet-poll-budget.test.js
          node tests/operations-data.test.js
          node tests/operations-data.browser.cjs
          node tests/managerdispatch.test.js
          node tests/dispatch-share.browser.cjs
          node tests/driver-ledger.test.js
          python3 tests/ledger-workbook.py
          node tests/run-history-plans.test.js
          node tests/run-log-timestamps.test.js
          node tests/historical-record-sync.test.js
          node tests/run-history.browser.cjs
          node tests/accident-report.test.js
          node tests/accident-report.browser.cjs
          node tests/accident-flow.browser.cjs
          node tests/current-date-schedule.test.js
          node tests/schedule-session-recovery.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-layout-synthetic-evidence
          path: ${{ runner.temp }}/contact-layout-output
          if-no-files-found: ignore

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Korean font for visual evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install WebKit test engine
        run: |
          npm install --prefix "$RUNNER_TEMP/ios-compat" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/ios-compat/node_modules/.bin/playwright" install --with-deps webkit
      - name: Verify browser compatibility with synthetic data
        env:
          BROWSER_ENGINE: webkit
          CONTACT_LAYOUT_OUTPUT: ${{ runner.temp }}/webkit-output
        run: |
          export NODE_PATH="$RUNNER_TEMP/ios-compat/node_modules"
          node tests/mobile-compat.browser.cjs
          node tests/schedule-controls.browser.cjs
          node tests/realtime-health.browser.cjs
          node tests/accident-report.browser.cjs
          node tests/accident-flow.browser.cjs
          node tests/dispatch-share.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-synthetic-evidence
          path: ${{ runner.temp }}/webkit-output
          if-no-files-found: ignore
