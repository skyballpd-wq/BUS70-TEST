name: BUS70 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore fixed signing keystore
        working-directory: android
        env:
          BUS70_KEYSTORE_BASE64: ${{ secrets.BUS70_KEYSTORE_BASE64 }}
        run: |
          test -n "$BUS70_KEYSTORE_BASE64"
          printf '%s' "$BUS70_KEYSTORE_BASE64" | base64 --decode > bus70-release.jks
          chmod 600 bus70-release.jks
      - name: Build fixed-signed release APK
        working-directory: android
        env:
          BUS70_KEYSTORE_PATH: ${{ github.workspace }}/android/bus70-release.jks
          BUS70_KEYSTORE_PASSWORD: ${{ secrets.BUS70_KEYSTORE_PASSWORD }}
          BUS70_KEY_ALIAS: ${{ secrets.BUS70_KEY_ALIAS }}
          BUS70_KEY_PASSWORD: ${{ secrets.BUS70_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BUS70-driver-fixed-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
