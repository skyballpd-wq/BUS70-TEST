name: BUS70 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BUS70-driver-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish validation APK on validation branch
        if: github.ref == 'refs/heads/validation/mobile-alerts-v51'
        run: |
          mkdir -p validation-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk validation-apk/BUS70-driver-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-apk/BUS70-driver-test.apk
          if git diff --cached --quiet; then
            echo "Validation APK is already current."
          else
            git commit -m "Publish Android validation APK [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
