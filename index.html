<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>BUS70 TEST · STEP 9</title>
  <meta name="theme-color" content="#153d6f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BUS70 TEST">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/bus70-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/bus70-180.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      background: #f4f6f8;
      color: #1f2937;
    }

    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: white;
    }

    .header {
      padding: 28px 22px 24px;
      background: #153d6f;
      color: white;
    }

    .route {
      font-size: 13px;
      opacity: .85;
      margin-bottom: 5px;
    }

    .title {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 14px;
      opacity: .85;
    }

    .content {
      padding: 26px 22px;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 12px 14px;
      margin-bottom: 25px;

      border-radius: 10px;
      background: #f1f5f9;

      font-size: 14px;
      font-weight: 600;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
      flex: 0 0 auto;
    }

    .dot.ok {
      background: #16a34a;
    }

    .dot.error {
      background: #dc2626;
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .login-help {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 17px 0 7px;
    }

    input {
      width: 100%;
      height: 52px;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      padding: 0 14px;

      font-size: 17px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #153d6f;
      box-shadow: 0 0 0 3px rgba(21,61,111,.10);
    }

    button {
      width: 100%;
      height: 54px;

      margin-top: 25px;

      border: 0;
      border-radius: 11px;

      background: #153d6f;
      color: white;

      font-size: 17px;
      font-weight: 800;

      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 10px;

      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
    }

    .message.ok {
      display: block;
      background: #f0fdf4;
      color: #166534;
    }

    .driver-card {
      display: none;

      margin-top: 24px;
      padding: 20px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      background: #fff;
    }

    .driver-card.show {
      display: block;
    }

    .driver-name {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;

      font-size: 15px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: #64748b;
    }

    .info-value {
      font-weight: 700;
      text-align: right;
    }

    .test-badge {
      display: inline-block;
      margin-left: 7px;
      padding: 3px 7px;

      border-radius: 6px;
      background: #fff7ed;
      color: #c2410c;

      font-size: 11px;
      vertical-align: middle;
    }

    .footer {
      padding: 30px 20px;
      text-align: center;

      color: #94a3b8;
      font-size: 12px;
    }

    /* STEP 8: 날짜별 운행조회 */
    .schedule-panel { margin-top: 24px; padding: 20px; border: 1px solid #e5e7eb; border-radius: 14px; }
    .schedule-panel[hidden], .driver-card[hidden] { display: none !important; }
    .schedule-panel h2 { font-size: 20px; margin: 0 0 8px; }
    .schedule-panel .hint { color: #64748b; font-size: 13px; line-height: 1.5; }
    .schedule-panel .control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .schedule-panel .control-row label { margin-top: 14px; }
    .schedule-panel select { width: 100%; height: 52px; padding: 0 8px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; font-size: 14px; }
    .schedule-panel button { margin-top: 14px; }
    .schedule-panel .result { margin-top: 18px; line-height: 1.6; }
    .schedule-panel .trip { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-top: 12px; }
    .schedule-panel .trip h3 { margin: 0 0 8px; font-size: 17px; }
    .schedule-panel .trip-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; padding: 9px 0; font-size: 14px; align-items: center; border-bottom: 1px solid #f1f5f9; }
    .schedule-panel .trip-row:last-child { border-bottom: 0; }
    .schedule-panel .trip-row .place { min-width: 0; overflow-wrap: anywhere; }
    .schedule-panel .trip-row strong { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .schedule-panel .trip-row .time-main { display: block; font-size: 16px; }
    .schedule-panel .trip-row .time-sub { display: block; color: #64748b; font-size: 12px; font-weight: 500; }
    .session-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 16px; }
    .session-bar button { width: auto; height: auto; margin: 0; padding: 10px 12px; font-size: 13px; background: #e2e8f0; color: #1f2937; }
    .remember-row { display:flex; align-items:center; gap:9px; margin: 15px 0 0; font-size: 14px; font-weight: 500; }
    .remember-row input { width: 18px; height: 18px; flex: 0 0 auto; }
    .remember-help { font-size: 12px; color: #64748b; line-height: 1.5; margin-top: 7px; }
    @media(max-width:380px) { .content { padding: 20px 14px; } .schedule-panel { padding: 14px; } .schedule-panel .trip { padding: 10px; } }

    .schedule-panel .notice { padding: 12px; border-radius: 9px; background: #f1f5f9; margin-top: 12px; }
    .schedule-panel .notice.error { background: #fef2f2; color: #b91c1c; }
    .schedule-panel .confirm-button { background: #166534; }
    .schedule-panel .confirm-button[hidden] { display: none; }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="route">소신여객 70번</div>
    <h1 class="title">BUS70</h1>
    <div class="subtitle">양성기사 운행관리 TEST</div>
  </header>

  <main class="content">

    <div class="api-status">
      <span id="apiDot" class="dot"></span>
      <span id="apiText">서버 연결 확인 중...</span>
    </div>

    <section id="loginSection">

      <div class="login-title">기사 로그인</div>

      <div class="login-help">
        성명과 사원번호를 입력하세요.
      </div>

      <label for="driverName">성명</label>
      <input
        id="driverName"
        type="text"
        autocomplete="name"
        placeholder="예: 박철완">

      <label for="empId">사원번호</label>
      <input
        id="empId"
        type="tel"
        inputmode="numeric"
        autocomplete="off"
        placeholder="예: 626023">

      <label class="remember-row" for="rememberDevice"><input id="rememberDevice" type="checkbox" checked> 이 휴대폰에서 다음부터 바로 열기</label>
      <div class="remember-help">개인 휴대폰의 TEST 화면에서만 선택하세요. 공용 휴대폰에서는 선택을 해제하세요.</div>
      <button id="loginButton" type="button">
        로그인
      </button>

      <div id="message" class="message"></div>

    </section>


    <div id="sessionBar" class="session-bar" hidden><strong id="sessionGreeting"></strong><button id="logoutButton" type="button">로그아웃 · 기사 변경</button></div>
    <section id="driverCard" class="driver-card">

      <div class="driver-name">
        <span id="resultName"></span>
        <span id="testBadge" class="test-badge">TEST</span>
      </div>

      <div class="info-row">
        <span class="info-label">사원번호</span>
        <span id="resultEmpId" class="info-value"></span>
      </div>

      <div class="info-row">
        <span class="info-label">근무조</span>
        <span id="resultShift" class="info-value"></span>
      </div>

      <div class="info-row">
        <span class="info-label">기사구분</span>
        <span id="resultDriverType" class="info-value"></span>
      </div>

      <div class="info-row">
        <span class="info-label">노선</span>
        <span id="resultRoute" class="info-value"></span>
      </div>

      <div class="info-row">
        <span class="info-label">상태</span>
        <span id="resultStatus" class="info-value"></span>
      </div>

    </section>


    <section id="schedulePanel" class="schedule-panel" hidden>
      <h2>내 운행시간표</h2>
      <p class="hint">날짜를 선택해 확정 배차를 조회합니다. 배차가 없다는 사실만으로 휴무로 판정하지 않습니다.</p>
      <div class="control-row">
        <div><label for="workDate">조회 날짜</label><input id="workDate" type="date" value="2026-09-18"></div>
        <div><label for="timeMode">시간 표시</label><select id="timeMode"><option value="BOTH">동시 표시</option><option value="24H">24시간</option><option value="12H">오전·오후</option></select></div>
      </div>
      <button id="loadSchedule" type="button">운행정보 조회</button>
      <div id="scheduleResult" class="result" aria-live="polite"></div>
      <button id="confirmScheduleButton" class="confirm-button" type="button" hidden>이 배차 확인하기</button>
      <div id="confirmResult" class="result" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    BUS70 TEST · Route 70
  </footer>

</div>


<script>
  /*
   * STEP 6-1
   *
   * 여기에 STEP 5에서 발급받은
   * Apps Script /exec URL을 넣습니다.
   *
   * 반드시 /exec 로 끝나는 원래 주소입니다.
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyFE-F4JEI8ITYO6RouVJh6KS5kvCFfs8y1u3_VO541SCpaSviwexPAOV6zPNculXfP/exec";


  const apiDot =
    document.getElementById("apiDot");

  const apiText =
    document.getElementById("apiText");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }


  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }


  async function apiRequest(params) {

    const url =
      API_URL +
      "?" +
      new URLSearchParams(params).toString();

    const response = await fetch(url, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    return await response.json();
  }


  async function checkServer() {

    if (
      !API_URL.startsWith("https://script.google.com/")
    ) {
      apiDot.className = "dot error";
      apiText.textContent =
        "API URL을 먼저 설정하세요.";
      return;
    }

    try {

      const data =
        await apiRequest({
          action: "ping"
        });

      if (data.ok) {

        apiDot.className = "dot ok";

        apiText.textContent =
          "BUS70 서버 연결 정상";

      } else {

        throw new Error(
          "PING 응답 오류"
        );
      }

    } catch (error) {

      console.error(error);

      apiDot.className = "dot error";

      apiText.textContent =
        "서버 연결 실패";
    }
  }


  let currentDriverId = "";
  let lastSchedule = null;
  const REMEMBER_KEY = "BUS70_TEST_AUTH_V3";
  const LEGACY_REMEMBER_KEY = "BUS70_TEST_REMEMBER_V2";
  let authToken = "";
  let scheduleRequestId = 0;
  const todayLocal = () => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  };

  function openDriverScreen(driver, automatic = false) {
    currentDriverId = String(driver.driverId || "");
    if (!currentDriverId) throw new Error("기사 ID가 없습니다.");
    const fields = {
      resultName: driver.name || "기사",
      resultEmpId: driver.empId || "자동 진입",
      resultShift: driver.shift ? driver.shift + "조" : "-",
      resultDriverType: driver.driverType || "-",
      resultRoute: driver.route ? driver.route + "번" : "-",
      resultStatus: driver.status || "-"
    };
    for (const [id, value] of Object.entries(fields)) document.getElementById(id).textContent = value;
    document.getElementById("testBadge").style.display = driver.test === "Y" ? "inline-block" : "none";
    document.getElementById("loginSection").hidden = true;
    document.getElementById("driverCard").classList.add("show");
    document.getElementById("sessionBar").hidden = false;
    document.getElementById("sessionGreeting").textContent = (driver.name || "기사") + " 기사님";
    document.getElementById("schedulePanel").hidden = false;
    document.getElementById("scheduleResult").replaceChildren();
    resetConfirmation();
    document.getElementById("workDate").value = todayLocal();
    if (automatic) loadMySchedule();
  }

  function resetConfirmation() {
    document.getElementById("confirmScheduleButton").hidden = true;
    document.getElementById("confirmScheduleButton").disabled = false;
    document.getElementById("confirmScheduleButton").textContent = "이 배차 확인하기";
    document.getElementById("confirmResult").replaceChildren();
  }

  async function apiPost(body) {
    // Apps Script 웹앱은 JSON 요청의 CORS 사전 요청을 처리하지 못할 수 있습니다.
    // text/plain으로 전송하고 서버의 JSON.parse(e.postData.contents)를 사용합니다.
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body),
      redirect: "follow",
      cache: "no-store"
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.json();
  }

  function clearLocalAuth() {
    localStorage.removeItem(REMEMBER_KEY);
    localStorage.removeItem(LEGACY_REMEMBER_KEY);
    localStorage.removeItem("BUS70_TEST_DRIVER");
    authToken = "";
  }

  function showLoginScreen(text) {
    scheduleRequestId++;
    clearLocalAuth();
    currentDriverId = "";
    lastSchedule = null;
    document.getElementById("loginSection").hidden = false;
    document.getElementById("driverCard").classList.remove("show");
    document.getElementById("sessionBar").hidden = true;
    document.getElementById("schedulePanel").hidden = true;
    document.getElementById("scheduleResult").replaceChildren();
    resetConfirmation();
    if (text) showMessage(text, "error"); else clearMessage();
  }

  async function logout() {
    const token = authToken;
    showLoginScreen();
    document.getElementById("driverName").value = "";
    document.getElementById("empId").value = "";
    if (token) {
      try { await apiPost({action:"logout", token}); }
      catch (error) { console.warn("서버 로그아웃 요청 실패. 기기 저장정보는 삭제했습니다.", error); }
    }
  }
  document.getElementById("logoutButton").addEventListener("click", logout);

  async function restoreRememberedDriver() {
    // 기존 V2 저장정보는 인증 토큰이 아니므로 자동 로그인에 사용하지 않습니다.
    localStorage.removeItem(LEGACY_REMEMBER_KEY);
    localStorage.removeItem("BUS70_TEST_DRIVER");
    let saved;
    try { saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || "null"); }
    catch (_) { clearLocalAuth(); return; }
    if (!saved || saved.v !== 3 || !saved.token) return;
    if (!Number.isFinite(Date.parse(saved.expiresAt)) || Date.parse(saved.expiresAt) <= Date.now()) {
      showLoginScreen("로그인 기간이 만료되었습니다. 다시 로그인하세요.");
      return;
    }
    try {
      const result = await apiPost({action:"session", token:saved.token});
      if (!result.ok || !result.driver) {
        showLoginScreen(result.message || "로그인이 만료되었습니다. 다시 로그인하세요.");
        return;
      }
      authToken = saved.token;
      openDriverScreen(result.driver, true);
    } catch (error) {
      console.error(error);
      showLoginScreen("자동 로그인 서버 확인에 실패했습니다. 연결 상태를 확인한 뒤 다시 로그인하세요.");
    }
  }

  async function login() {

    clearMessage();

    const name =
      document
        .getElementById("driverName")
        .value
        .trim();

    const empId =
      document
        .getElementById("empId")
        .value
        .trim();


    if (!name) {
      showMessage(
        "성명을 입력하세요.",
        "error"
      );
      return;
    }


    if (!empId) {
      showMessage(
        "사원번호를 입력하세요.",
        "error"
      );
      return;
    }


    loginButton.disabled = true;
    loginButton.textContent = "확인 중...";


    try {

      const data =
        await apiRequest({
          action: "login",
          name: name,
          empId: empId
        });


      if (!data.ok) {

        showMessage(
          data.message ||
          "로그인 정보를 확인하세요.",
          "error"
        );

        return;
      }


      const driver = data.driver;
      openDriverScreen(driver);
             if (document.getElementById("rememberDevice").checked) {
         localStorage.setItem(REMEMBER_KEY, JSON.stringify({
           v:3, token:data.token, expiresAt:data.expiresAt
         }));
       } else {
         localStorage.removeItem(REMEMBER_KEY);
       }
       localStorage.removeItem(LEGACY_REMEMBER_KEY);
loadMySchedule();

    } catch (error) {

      console.error(error);

      showMessage(
        "서버와 통신하지 못했습니다.",
        "error"
      );

    } finally {

      loginButton.disabled = false;
      loginButton.textContent = "로그인";
    }
  }


  loginButton.addEventListener(
    "click",
    login
  );


  document
    .getElementById("empId")
    .addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          login();
        }
      }
    );



  // API 시간 문자열은 시트 표시 형식에 따라 5:05 또는 05:05로 올 수 있습니다.
  function canonicalTime(value) {
    const m = String(value || "").trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m || Number(m[1]) > 23 || Number(m[2]) > 59) return String(value || "");
    return m[1].padStart(2, "0") + ":" + m[2];
  }

  function displayTime(value) {
    const t = canonicalTime(value);
    if (!/^\d{2}:\d{2}$/.test(t)) return t || "-";
    const h = Number(t.slice(0, 2));
    const korean = (h < 12 ? "오전 " : "오후 ") + (h % 12 || 12) + t.slice(2);
    const mode = document.getElementById("timeMode").value;
    return mode === "24H" ? t : mode === "12H" ? korean : t + " (" + korean + ")";
  }

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function tripRow(label, place, time) {
    const row = el("div", undefined, "trip-row");
    row.append(el("span", label + (place ? " · " + place : ""), "place"));
    const t = el("strong");
    const full = displayTime(time);
    const mode = document.getElementById("timeMode").value;
    if (mode === "BOTH" && full.includes(" (")) {
      const cut = full.indexOf(" (");
      t.append(el("span", full.slice(0, cut), "time-main"), el("span", full.slice(cut + 2, -1), "time-sub"));
    } else t.append(el("span", full, "time-main"));
    row.append(t);
    return row;
  }

  function renderSchedule() {
    const root = document.getElementById("scheduleResult");
    root.replaceChildren();
    const data = lastSchedule;
    resetConfirmation();
    if (!data) return;
    if (!data.ok) {
      root.append(el("div", data.message || "조회에 실패했습니다.", "notice error"));
      return;
    }
    root.append(el("h3", data.date?.label || document.getElementById("workDate").value));
    if (data.type === "NO_DISPATCH") {
      root.append(el("div", "확정된 배차가 없습니다. 휴무 여부는 아직 확인되지 않았습니다.", "notice"));
      return;
    }
    if (data.type !== "WORK" || !data.dispatch || !data.vehicle) {
      root.append(el("div", "배차 응답을 확인할 수 없습니다. 관리자에게 문의하세요.", "notice error"));
      return;
    }
    const d = data.dispatch;
    const vehicle = data.vehicle;
    root.append(el("div", "운행 · " + (d.shift || "-") + "조 · " + d.seq + "순차 · " + (vehicle.displayNo || vehicle.vehicleNo || "차량 미확인"), "notice"));
    if (!Array.isArray(data.trips) || !data.trips.length) {
      root.append(el("div", "등록된 탕별 시간표가 없습니다.", "notice error"));
      return;
    }
    data.trips.forEach(trip => {
      const card = el("article", undefined, "trip");
      card.append(el("h3", trip.trip + "탕"));
      card.append(tripRow("발차", trip.startPlace, trip.startTime));
      if (trip.turnPlace || trip.turnTime) card.append(tripRow("회차", trip.turnPlace, trip.turnTime));
      card.append(tripRow("도착", trip.endPlace, trip.endTime));
      root.append(card);
    });
  }

  async function loadMySchedule() {
    if (!currentDriverId) return;
    const date = document.getElementById("workDate").value;
    const button = document.getElementById("loadSchedule");
    const root = document.getElementById("scheduleResult");
    if (!date) { root.replaceChildren(el("div", "날짜를 선택하세요.", "notice error")); return; }
    const requestId = ++scheduleRequestId;
    lastSchedule = null;
    resetConfirmation();
    root.replaceChildren(el("div", "운행정보 조회 중...", "notice"));
    button.disabled = true;
    try {
      const data = await apiRequest({ action: "mySchedule", driverId: currentDriverId, date });
      // 날짜를 바꾼 뒤 이전 응답이 도착한 경우 오래된 결과를 표시하지 않습니다.
      if (document.getElementById("workDate").value !== date) return;
      lastSchedule = data;
      renderSchedule();
    } catch (error) {
      console.error(error);
      root.replaceChildren(el("div", "서버 조회에 실패했습니다. 연결 상태를 확인하고 다시 시도하세요.", "notice error"));
    } finally {
      button.disabled = false;
    }
  }

  document.getElementById("loadSchedule").addEventListener("click", loadMySchedule);
  document.getElementById("timeMode").addEventListener("change", renderSchedule);
  document.getElementById("workDate").addEventListener("change", () => {
    lastSchedule = null;
    document.getElementById("scheduleResult").replaceChildren();
  });

  // 설치된 PWA의 정적 화면 파일만 캐시합니다. 배차 API 응답은 캐시하지 않습니다.
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(error => console.warn("PWA 등록 실패", error));
    });
  }

  checkServer();
  restoreRememberedDriver();

</script>

</body>
</html>
